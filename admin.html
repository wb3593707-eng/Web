<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Admin</title><style>body{font:16px system-ui;background:#0a0d14;color:#e8edf7;max-width:640px;margin:2rem auto;padding:0 1rem}
input,textarea,button{width:100%;font:inherit;padding:.7rem;margin:.4rem 0;border-radius:8px;border:1px solid #243049;background:#121826;color:inherit}
button{background:#ffb020;color:#1a0d00;font-weight:600;cursor:pointer}pre{background:#121826;padding:1rem;border-radius:8px;overflow:auto}</style></head><body>
<h1>Admin da loja</h1>
<input id="k" type="password" placeholder="ADMIN_KEY" autocomplete="off">
<button id="s">Ver estoque e pedidos</button>
<h2>Adicionar contas</h2>
<p>Uma por linha: <code>login;senha;id_do_jogador</code></p>
<textarea id="t" rows="8" placeholder="conta1@email.com;senha123;1234567890"></textarea>
<button id="a">Adicionar ao estoque</button>
<pre id="o"></pre>
<script>
const h=()=>({'Content-Type':'application/json','x-admin-key':document.getElementById('k').value});
const out=v=>document.getElementById('o').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);
document.getElementById('s').onclick=async()=>{const r=await fetch('/api/admin/summary',{headers:h()});out(await r.json())};
document.getElementById('a').onclick=async()=>{
  const items=document.getElementById('t').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [login,password,playerId]=l.split(';');return{login,password,playerId}});
  const r=await fetch('/api/admin/accounts',{method:'POST',headers:h(),body:JSON.stringify({items})});
  const j=await r.json();out(j);if(r.ok)document.getElementById('t').value='';
};
</script></body></html>
